# 这是示例文件，会被当作真实配置加载。正式使用前请修改或删除
# 同一目录（含子目录）下所有 .yml 都会加载，药水节点不能重复

# 药水节点名，指令和占位符都用它
测试药水:
  # 识别物品用的内容，& 会转换成颜色符号。不写时默认等于节点名
  # match-mode 为 name 时建议带颜色符号：原版铁砧打不出颜色，不容易被伪造
  match: '&a测试药水'
  # 所属药水组（可选）。同组药水共享组冷却，组冷却时间在 config.yml 设置
  group: '初级药水组'
  # 药水自身冷却，单位秒，可写小数。默认 0（无冷却）
  cooldown: 30.0
  # 按键长按时长，单位秒，可写小数。默认 0（按下立即使用）。只对按键触发有效
  press: 0
  # 哪些操作可以使用药水。不写表示不限制；写了但全部写错时，这些操作都不能使用
  triggers:
    - RIGHT_CLICK_AIR # 右键空气
    - RIGHT_CLICK_BLOCK # 右键方块
    - KEY # 按键。需要龙核/萌芽/云拾/ArcartX，旧写法 DRAGON/GERM/CLOUD 等同于 KEY
    # - LEFT_CLICK_AIR # 左键空气
    # - LEFT_CLICK_BLOCK # 左键方块
    # - ALL # 以上全部
  # 使用条件，全部满足才能使用。格式：表达式<->失败消息，失败消息可省略
  # 比较符：>= <= > < == !=，可用 && || 和括号组合。字符串比较要加引号，只支持 == 和 !=
  # 表达式写错时按不满足处理，并在后台提示。{id} 是药水节点，变量需要 PlaceholderAPI
  conditions:
    - '%player_level%>=10<->&c你的等级不足10级,无法使用{id}!'
    - '"%player_has_permission_vip%"=="yes"<->&c你没有VIP权限，无法使用{id}!'
  # 持续时间，单位秒，可写小数。-1 表示永久，0（默认）表示瞬时：attributes 和 tick 在 1 秒内结束
  time: 10.0
  # 增加的属性，格式：属性名: 数值。可用变量和四则运算，结果保留 4 位小数
  # 不支持 xx-xx 范围格式，10-20 会按减法算成 -10
  # 需要 config.yml 的 attribute-plugin 对应的属性插件
  attributes:
    物理伤害: "100"
    生命力: "%player_level%*2+100"
  # 原版药水效果。格式：效果名: '等级<->持续秒数'，等级从 1 开始
  # {time} 取上面的 time。时长超过 time 时按 time 计算；time 为 0 时按这里写的时长；time 为 -1 时写 {time} 表示持续到药水被移除
  # 效果名见 https://bukkit.windit.net/javadoc/org/bukkit/potion/PotionEffectType.html
  # 药水被提前移除时，等级相同的效果会一起移除
  effects:
    NIGHT_VISION: '1<->10'
  # 恢复效果（可选）。格式：数值<->持续秒数<->模式。第 0 秒恢复一次，之后每秒一次
  # 数值可以是负数，表示扣除。扣血可以把玩家扣死
  # 持续秒数写 0 表示只恢复一次；超过 time 时按 time 计算；time 为 0 时只恢复一次
  # time 为 -1 时写 {time} 表示持续到药水被移除
  # 模式 0：固定数值，1：当前值的百分比，2：最大值的百分比
  regen:
    # 生命：每秒恢复最大生命的 10%，持续 5 秒
    health: '10<->5<->2'
    # 魔力：需要 SkillAPI 或 Yetzirah，都安装时用 SkillAPI
    mana: '10<->{time}<->1'
    # 饱食度：每秒恢复 2 点，持续 5 秒
    hunger: '2<->5<->0'
  # 动作（可选）。不写前缀时以玩家身份执行指令。{id} 是药水节点，%变量% 需要 PlaceholderAPI
  # 没有 PlaceholderAPI 时只支持 %player_name% 和 %player%
  actions:
    # 使用成功后执行
    success:
      - '[msg]&a成功使用了{id}!奖励你一个钻石' # 给玩家发消息
      - '[console]give %player_name% diamond 1' # 控制台执行
      - '[title]大标题<->小标题<->20<->60<->20' # 标题：大标题<->小标题<->淡入<->停留<->淡出，后三个单位 tick
      - '[actionbar]这是actionbar' # 物品栏上方文字
      - '[bossbar]这是bossbar<->BLUE<->SEGMENTED_10<->10' # BossBar：标题<->颜色<->样式<->秒数，-1 表示显示到下线
      # - '[op]spawn' # 临时给 OP 执行。有安全风险，优先用 [console]
    # 药水结束后执行：到期、被移除、被覆盖使用都会执行
    # 玩家正常下线和关服不算结束，药水会存档并在下次进服继续
    end:
      - '[msg]&c{id}效果结束了!'
    # 周期执行：间隔 tick 数: 动作列表
    tick:
      20:
        - '[msg]&a每秒执行一次指令'
      100:
        - '[msg]&a每五秒执行一次指令'
  # 范围半径，单位格。需要开启下面的 optional.range，默认 0
  distance: 10.0
  # 其他设置，不写时取括号内默认值
  optional:
    # 使用后是否消耗物品（默认 true）
    consume: true
    # 效果还在时能否再次使用（默认 true）。再次使用会先结束旧效果并执行 end 动作
    cover: true
    # 是否需要潜行才能使用（默认 false）
    shift: false
    # 死亡时是否结束药水并执行 end 动作（默认 false）。对 time 为 -1 的永久药水无效
    death: false
    # 下线时是否结束药水并执行 end 动作（默认 false）。false 时药水存档，时间在离线期间继续流逝
    quit: false
    # 使用后是否让物品进入原版冷却（默认 false）。同材料的所有物品都会一起冷却，期间客户端不能右键使用这种物品
    cool: false
    # 是否让 distance 范围内的其他玩家也获得效果（默认 false）
    # 被波及者不检查条件、不占用自己的冷却，但会执行 success 动作
    range: false
    # 是否显示剩余时间 BossBar（默认 false），样式在 config.yml 设置
    bossbar: false
    # NBT 次数用完时是否移除物品（默认 false）。false 时物品保留，但不能再使用
    break: false

# 长按示例：放进按键槽位，按住 2.5 秒后使用
测试按住药水:
  match: '&b测试按住药水'
  # 按住达到这个秒数后自动使用，不需要松开。提前松开时进度按真实时间回退
  press: 2.5
  triggers:
    - KEY
  time: 30.0
  attributes:
    物理伤害: "50"
